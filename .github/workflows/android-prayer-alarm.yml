name: Android Prayer Alarm Prototype APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-prayer-alarm-prototype
    paths:
      - 'android-prayer-alarm/**'
      - '.github/workflows/android-prayer-alarm.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android-prayer-alarm
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Compile debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: unbroken-prayer-alarm-debug-apk
          path: android-prayer-alarm/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
