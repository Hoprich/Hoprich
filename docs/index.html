<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unbroken Fellowship • Live Staging Test</title>
<style>
:root{font-family:system-ui,sans-serif;color:#182a47;background:#f6f4ee}*{box-sizing:border-box}body{margin:0}main{max-width:680px;margin:auto;padding:18px}header{background:#162c4d;color:white;padding:28px 20px;border-radius:0 0 18px 18px}h1{margin:0;font-size:1.7rem}h2{font-size:1.15rem}section{background:white;padding:20px;margin:16px 0;border:1px solid #e5e4e0;border-radius:16px}label{display:block;font-weight:600;margin-top:12px}input,select,button{width:100%;padding:12px;margin-top:6px;border:1px solid #bfc8d3;border-radius:9px;font:inherit}button{background:#173a67;color:white;border:0;margin-top:12px;font-weight:650}button:disabled{opacity:.5}button.alt{background:#e8edf3;color:#173a67}small,.muted{color:#526073}#status{white-space:pre-wrap;overflow-wrap:anywhere;padding:12px;background:#edf2f8;border-radius:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere}#diagnostics span{display:block;padding:4px 0}header small{color:#e3eaf4}</style></head>
<body><header><main><h1>The Unbroken Fellowship</h1><small>Controlled staging • Registration & prayer scheduling</small></main></header><main>
<section><h2>1. Account access</h2><label>Email<input id="email" type="email" autocomplete="email"></label><label>Password<input id="password" type="password" autocomplete="current-password" minlength="8"></label><button id="signup">Create test account</button><button id="signin" class="alt">Sign in</button><button id="signout" class="alt">Sign out</button><p id="who" class="muted">Checking sign-in status…</p></section>
<section><h2>2. Prayer commitment</h2><label>Time zone<select id="tz"><option value="Africa/Lagos">Nigeria (Africa/Lagos)</option><option value="Europe/London">London</option><option value="America/Toronto">Toronto</option><option value="America/New_York">New York</option><option value="UTC">UTC</option></select></label><label>Duration<select id="duration"><option value="5">5 minutes</option><option value="15">15 minutes</option><option value="20">20 minutes</option><option value="30">30 minutes</option><option value="60">60 minutes</option></select></label><label>Frequency<select id="frequency"><option value="hourly">Every hour</option><option value="daily">Every day</option><option value="weekly">Weekly (all selected days for this test)</option></select></label><label>Start time / hourly minute offset<input type="time" id="start" value="00:00"></label><button id="register">Save my commitment</button><button class="alt" id="refresh">Refresh my schedule</button><pre id="items" class="muted">No schedule loaded.</pre></section>
<section><h2>3. Test diagnostics</h2><div id="diagnostics"></div><p id="status" role="status">Initializing…</p><small>Do not share your password or authentication tokens. This test is not a public prayer service.</small></section>
</main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const base='https://mknqsryjnveoyfjzrtcg.supabase.co', key="sb_publishable_2TwrR0If0edpu2hd-0CohA_yFTlNd4J";
const db=createClient(base,key), $=id=>document.getElementById(id), say=x=>$('status').textContent=x;
async function check(){try{const {data,error}=await db.auth.getUser();$('who').textContent=data.user?'Signed in: '+data.user.email:'Not signed in';$('diagnostics').innerHTML='<span>✓ Frontend JavaScript loaded</span><span>✓ Supabase client initialized</span><span>'+ (error?'ℹ Sign-in required':'✓ Authentication checked')+'</span>'}catch(e){say('Connection error: '+e.message)}}
$('signup').onclick=async()=>{say('Creating account…');const {data,error}=await db.auth.signUp({email:$('email').value.trim(),password:$('password').value});say(error?.message||(data.session?'Account created and signed in.':'Registration requested. Confirm your email if prompted, then sign in.'));check()};
$('signin').onclick=async()=>{say('Signing in…');const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});say(error?.message||'Signed in successfully.');check()};
$('signout').onclick=async()=>{await db.auth.signOut();say('Signed out.');check()};
$('register').onclick=async()=>{try{const {data:{session}}=await db.auth.getSession();if(!session){say('Sign in first.');return}const tz=$('tz').value;const starts_on=new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());const payload={recurrence_type:$('frequency').value,prayer_mode:'either',timezone:tz,duration_minutes:Number($('duration').value),local_start_time:$('start').value+':00',days_of_week:[0,1,2,3,4,5,6],starts_on};say('Saving…');const res=await fetch(base+'/functions/v1/register-prayer-commitment',{method:'POST',headers:{'content-type':'application/json','apikey':key,'authorization':'Bearer '+session.access_token},body:JSON.stringify(payload)});const raw=await res.text();say('Registration HTTP '+res.status+'\n'+raw);if(res.ok)$('refresh').click()}catch(e){say('Registration request failed: '+e.message)}};
$('refresh').onclick=async()=>{const a=await db.from('prayer_commitments').select('id,recurrence_type,duration_minutes,timezone,starts_on').order('created_at',{ascending:false}).limit(10);const b=await db.from('personal_prayer_sessions').select('starts_at,ends_at,status').order('starts_at',{ascending:true}).limit(30);$('items').textContent=JSON.stringify({commitments:a.data,appointments:b.data,errors:[a.error?.message,b.error?.message].filter(Boolean)},null,2)};
say('Interface ready. Sign in or create a test account.');check();
</script></body></html>
