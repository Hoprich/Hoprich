<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unbroken Fellowship • Live Staging Test</title>
<style>
:root{font-family:system-ui,sans-serif;color:#182a47;background:#f6f4ee}*{box-sizing:border-box}body{margin:0}main{max-width:680px;margin:auto;padding:18px}header{background:#162c4d;color:white;padding:28px 20px;border-radius:0 0 18px 18px}h1{margin:0;font-size:1.7rem}h2{font-size:1.15rem}section{background:white;padding:20px;margin:16px 0;border:1px solid #e5e4e0;border-radius:16px}label{display:block;font-weight:600;margin-top:12px}input,select,button{width:100%;padding:12px;margin-top:6px;border:1px solid #bfc8d3;border-radius:9px;font:inherit}button{background:#173a67;color:white;border:0;margin-top:12px;font-weight:650}button:disabled{opacity:.5}button.alt{background:#e8edf3;color:#173a67}small,.muted{color:#526073}#status{white-space:pre-wrap;overflow-wrap:anywhere;padding:12px;background:#edf2f8;border-radius:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere}#diagnostics span{display:block;padding:4px 0}header small{color:#e3eaf4}</style></head>
<body><header><main><h1>The Unbroken Fellowship</h1><small>Controlled staging • Registration & prayer scheduling</small></main></header><main>
<section><h2>1. Account access</h2><label>Email<input id="email" type="email" autocomplete="email"></label><label>Password<input id="password" type="password" autocomplete="current-password" minlength="8"></label><button id="signup">Create test account</button><button id="signin" class="alt">Sign in</button><button id="signout" class="alt">Sign out</button><p id="who" class="muted">Checking sign-in status…</p></section>
<section><h2>2. Prayer commitment</h2><label>Time zone<select id="tz"><option value="Africa/Lagos">Nigeria (Africa/Lagos)</option><option value="Europe/London">London</option><option value="America/Toronto">Toronto</option><option value="America/New_York">New York</option><option value="UTC">UTC</option></select></label><label>Duration<select id="duration"><option value="5">5 minutes</option><option value="15">15 minutes</option><option value="20">20 minutes</option><option value="30">30 minutes</option><option value="60">60 minutes</option></select></label><label>Frequency<select id="frequency"><option value="hourly">Every hour</option><option value="daily">Every day</option><option value="weekly">Weekly (all selected days for this test)</option></select></label><label>Start time (for hourly prayer, only the minute is used)<input type="time" id="start" value="00:00"></label><button id="register">Save my commitment</button><button class="alt" id="refresh">Refresh my schedule</button><pre id="items" class="muted">No schedule loaded.</pre></section>
<section><h2>3. Test diagnostics</h2><div id="diagnostics"></div><p id="status" role="status">Initializing…</p><small>Do not share your password or authentication tokens. This test is not a public prayer service.</small></section>
</main><script>
(function(){
"use strict";
const base="https://mknqsryjnveoyfjzrtcg.supabase.co",key="sb_publishable_2TwrR0If0edpu2hd-0CohA_yFTlNd4J";
const $=id=>document.getElementById(id);
const status=message=>{$("status").textContent=message;};
const sessionKey="unbroken-staging-session";
let session=null;
try{session=JSON.parse(localStorage.getItem(sessionKey)||"null");}catch{}
function save(s){session=s; if(s)localStorage.setItem(sessionKey,JSON.stringify(s));else localStorage.removeItem(sessionKey);render();}
function render(){ $("who").textContent=session?.access_token?"Signed in (staging account)":"Not signed in"; }
function info(s){$("diagnostics").textContent=s;}
async function request(path,{method="GET",body,authenticated=false}={}){
 const headers={"apikey":key,"Content-Type":"application/json"};
 if(authenticated){
  if(!session?.access_token)throw Error("Please sign in first.");
  if(session.expires_at&&Date.now()/1000>session.expires_at-90){
   if(!session.refresh_token)throw Error("Session expired. Please sign in again.");
   const renewed=await request("/auth/v1/token?grant_type=refresh_token",{method:"POST",body:{refresh_token:session.refresh_token}});
   if(!renewed.access_token)throw Error("Session expired. Please sign in again.");
   save({...renewed,expires_at:Math.floor(Date.now()/1000)+(renewed.expires_in||3600)});
  }
  headers.Authorization="Bearer "+session.access_token;
 }
 const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),15000);
 let response;
 try{response=await fetch(base+path,{method,headers,body:body?JSON.stringify(body):undefined,signal:controller.signal});}
 finally{clearTimeout(timeout);}
 const raw=await response.text();let data;
 try{data=JSON.parse(raw);}catch{data={message:raw.slice(0,180)};}
 if(!response.ok)throw Error((data.msg||data.error_description||data.message||data.error||"Request failed")+" (HTTP "+response.status+")");
 return data;
}
function wire(id,fn){$(id).addEventListener("click",async()=>{const button=$(id);button.disabled=true;status("Working…");try{await fn();}catch(e){status("Error: "+(e.name==="AbortError"?"Request timed out":e.message));}finally{button.disabled=false;}});}
wire("signup",async()=>{
 const email=$("email").value.trim(),password=$("password").value;
 if(!email||password.length<8)throw Error("Enter a valid email and a password of at least 8 characters.");
 const data=await request("/auth/v1/signup",{method:"POST",body:{email,password}});
 if(data.access_token){save({...data,expires_at:Math.floor(Date.now()/1000)+(data.expires_in||3600)});status("Account created and signed in. Opening your prayer dashboard…");window.location.assign("./dashboard.html");}
 else status("Registration request accepted. Check your email for confirmation, then sign in.");
});
wire("signin",async()=>{
 const data=await request("/auth/v1/token?grant_type=password",{method:"POST",body:{email:$("email").value.trim(),password:$("password").value}});
 if(!data.access_token)throw Error("Sign-in did not return a session.");
 save({...data,expires_at:Math.floor(Date.now()/1000)+(data.expires_in||3600)});
 status("Signed in successfully. Opening your prayer dashboard…");window.location.assign("./dashboard.html");
});
wire("signout",async()=>{save(null);status("Signed out on this device.");});
wire("register",async()=>{
 if(!session?.access_token)throw Error("Sign in first.");
 const timezone=$("tz").value,recurrence_type=$("frequency").value;
 let local_start_time=$("start").value||"00:00";
 if(recurrence_type==="hourly"){local_start_time="00:"+local_start_time.split(":")[1];}
 const parts=new Intl.DateTimeFormat("en-GB",{timeZone:timezone,year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
 const value=t=>parts.find(p=>p.type===t).value;
 const starts_on=value("year")+"-"+value("month")+"-"+value("day");
 const data=await request("/functions/v1/register-prayer-commitment",{method:"POST",authenticated:true,body:{recurrence_type,prayer_mode:"either",timezone,duration_minutes:Number($("duration").value),local_start_time:local_start_time+":00",days_of_week:[0,1,2,3,4,5,6],starts_on}});
 status("Commitment saved. ID: "+data.commitment.id+". Appointments are generated by the scheduled job.");
 await refresh();
});
async function refresh(){
 const a=await request("/rest/v1/prayer_commitments?select=id,recurrence_type,duration_minutes,timezone,starts_on&order=created_at.desc&limit=10",{authenticated:true});
 const b=await request("/rest/v1/personal_prayer_sessions?select=starts_at,ends_at,status&order=starts_at.asc&limit=30",{authenticated:true});
 $("items").textContent=JSON.stringify({commitments:a,appointments:b},null,2);
 status("Schedule refreshed: "+a.length+" commitment(s), "+b.length+" appointment(s).");
}
wire("refresh",refresh);
render();info("✓ Built-in JavaScript initialized. No external library required.");
status("Ready. Create an account or sign in.");
})();
</script></body></html>
